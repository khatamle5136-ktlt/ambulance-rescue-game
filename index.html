<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>🚑 Cuộc Đua Cứu Hộ</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: "Times New Roman", Times, serif;
    background: #101522;
    color: #fff;
}

body {
    display: flex;
    justify-content: center;
}

button,
input {
    font-family: "Times New Roman", Times, serif;
}

button {
    cursor: pointer;
    touch-action: manipulation;
}

#app {
    width: 100%;
    max-width: 560px;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24334f 0%, #101522 45%);
    position: relative;
    overflow: hidden;
}

/* =========================
   START SCREEN
========================= */

#startScreen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo .emoji {
    font-size: 72px;
    animation: ambulanceFloat 2s infinite ease-in-out;
}

.logo h1 {
    margin: 10px 0 5px;
    font-size: 31px;
    color: #ff4d5a;
}

.logo p {
    margin: 0;
    color: #cbd5e1;
    font-size: 17px;
}

.start-card {
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 24px;
    padding: 22px;
    box-shadow: 0 15px 40px rgba(0,0,0,.25);
}

.start-card label {
    display: block;
    margin-bottom: 8px;
    font-size: 18px;
}

.team-input {
    width: 100%;
    padding: 16px;
    border-radius: 15px;
    border: 2px solid #334155;
    background: #0f172a;
    color: #fff;
    outline: none;
    font-size: 18px;
}

.team-input:focus {
    border-color: #38bdf8;
}

.start-btn {
    width: 100%;
    margin-top: 15px;
    border: 0;
    border-radius: 15px;
    padding: 16px;
    background: linear-gradient(135deg,#ef4444,#f97316);
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    box-shadow: 0 8px 20px rgba(239,68,68,.3);
}

.sound-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.1);
    color: #fff;
    font-size: 22px;
}

.start-sound {
    display: flex;
    justify-content: center;
    margin-top: 18px;
}

/* =========================
   GAME
========================= */

#gameScreen {
    display: none;
    min-height: 100vh;
    padding-bottom: 25px;
}

.topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
    padding: 12px;
    background: rgba(15,23,42,.96);
    border-bottom: 1px solid rgba(255,255,255,.08);
}

.team-name {
    font-size: 17px;
    font-weight: bold;
}

.stage-text {
    color: #94a3b8;
    margin-top: 3px;
}

.stats {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
}

.hearts {
    letter-spacing: 1px;
    white-space: nowrap;
}

.score {
    background: #172554;
    padding: 5px 9px;
    border-radius: 9px;
}

.game-sound {
    grid-column: 2;
    grid-row: 1 / span 2;
    align-self: center;
}

/* =========================
   TIMER
========================= */

.timer-box {
    padding: 10px 14px;
}

.timer {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #fff;
    background: #172033;
    border-radius: 14px;
    padding: 7px;
    border: 2px solid #334155;
}

.timer.warning {
    color: #facc15;
    border-color: #facc15;
}

.timer.danger {
    color: #ef4444;
    border-color: #ef4444;
    animation: pulse .7s infinite;
}

/* =========================
   MAIN IMAGE
========================= */

.map-wrap {
    padding: 0 12px;
}

.map {
    position: relative;
    width: 100%;
    height: 245px;
    border-radius: 20px;
    overflow: hidden;
    background: #172033;
    box-shadow: 0 10px 25px rgba(0,0,0,.35);
}

.main-scene {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition:
        filter .6s ease,
        transform .6s ease,
        opacity .5s ease;
}

/* Ambulance chạy trên ảnh */

.ambulance {
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    font-size: 48px;
    z-index: 20;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,.45));
    transition: all .9s ease;
}

.ambulance.move-forward {
    bottom: 70%;
    transform: translateX(-50%) scale(1.08);
}

.ambulance.shake {
    animation: shake .25s infinite;
}

/* =========================
   EFFECT OVERLAY
========================= */

.effect-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity .4s ease;
}

.effect-overlay.active {
    opacity: 1;
}

/* DARK */

.effect-dark {
    background:
        radial-gradient(circle at 50% 70%,
        rgba(255,230,120,.12),
        rgba(0,0,0,.88));
}

/* RAIN */

.effect-rain {
    background:
        repeating-linear-gradient(
            110deg,
            transparent 0,
            transparent 9px,
            rgba(190,225,255,.45) 10px,
            rgba(190,225,255,.45) 12px
        );
    animation: rainMove .35s linear infinite;
}

/* FOG */

.effect-fog {
    background:
        radial-gradient(
            ellipse at center,
            rgba(255,255,255,.08),
            rgba(220,230,240,.6)
        );
    filter: blur(1px);
}

/* FIRE */

.effect-fire {
    background:
        radial-gradient(circle at 30% 65%,
            rgba(255,70,0,.8),
            transparent 18%),
        radial-gradient(circle at 65% 55%,
            rgba(255,170,0,.7),
            transparent 20%);
    animation: firePulse .5s infinite alternate;
}

/* FLOOD */

.effect-flood {
    background:
        linear-gradient(
            0deg,
            rgba(20,120,220,.65),
            rgba(50,160,240,.05)
        );
    animation: waterMove 1.2s infinite alternate;
}

/* TRAFFIC */

.effect-traffic {
    background:
        radial-gradient(circle at 30% 45%,
        rgba(255,0,0,.45), transparent 9%),
        radial-gradient(circle at 70% 40%,
        rgba(255,200,0,.45), transparent 9%);
    animation: trafficBlink .7s infinite alternate;
}

/* WARNING */

.effect-warning {
    border: 8px solid rgba(255,190,0,.7);
    animation: warningBlink .6s infinite;
}

/* SMOKE */

.effect-smoke {
    background:
        radial-gradient(circle at 35% 40%,
        rgba(80,80,80,.65), transparent 25%),
        radial-gradient(circle at 65% 35%,
        rgba(60,60,60,.5), transparent 22%);
    animation: smokeMove 1.5s infinite alternate;
}

/* =========================
   SITUATION CARD
========================= */

.situation {
    display: none;
    margin: 12px;
    padding: 15px;
    border-radius: 18px;
    background: linear-gradient(135deg,#1e293b,#172033);
    border: 1px solid rgba(255,255,255,.1);
    animation: slideUp .4s ease;
}

.situation.show {
    display: block;
}

.situation-title {
    font-size: 23px;
    font-weight: bold;
    margin-bottom: 5px;
}

.situation-text {
    color: #cbd5e1;
    font-size: 17px;
    line-height: 1.35;
}

/* =========================
   QUESTION
========================= */

.question-card {
    margin: 12px;
    padding: 17px;
    background: #f8fafc;
    color: #172033;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,.2);
}

.question-label {
    font-size: 15px;
    color: #64748b;
    margin-bottom: 6px;
}

.question-text {
    font-size: 21px;
    font-weight: bold;
    line-height: 1.35;
}

.answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.answer-btn {
    min-height: 62px;
    border: 2px solid #cbd5e1;
    border-radius: 15px;
    background: #fff;
    color: #172033;
    font-size: 18px;
    font-weight: bold;
    padding: 10px;
}

.answer-btn:active {
    transform: scale(.97);
}

.answer-btn.correct {
    background: #dcfce7;
    border-color: #22c55e;
}

.answer-btn.wrong {
    background: #fee2e2;
    border-color: #ef4444;
}

/* =========================
   ITEM / ROUTE
========================= */

.choice-card {
    display: none;
    margin: 12px;
    padding: 17px;
    border-radius: 20px;
    background: #172033;
    border: 1px solid rgba(255,255,255,.1);
}

.choice-card.show {
    display: block;
    animation: slideUp .4s ease;
}

.choice-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 12px;
}

.items {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 8px;
}

.item-btn {
    min-height: 85px;
    border-radius: 15px;
    border: 2px solid #334155;
    background: #0f172a;
    color: #fff;
    padding: 8px 4px;
    font-size: 15px;
}

.item-btn .item-icon {
    display: block;
    font-size: 30px;
    margin-bottom: 4px;
}

.item-btn.selected {
    border-color: #38bdf8;
    background: #172554;
    transform: translateY(-2px);
}

.routes {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 9px;
}

.route-btn {
    min-height: 70px;
    border: 0;
    border-radius: 15px;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
}

.route-left {
    background: #e11d48;
}

.route-straight {
    background: #2563eb;
}

.route-right {
    background: #16a34a;
}

/* =========================
   FEEDBACK
========================= */

.feedback {
    display: none;
    margin: 12px;
    padding: 17px;
    border-radius: 18px;
    background: #1e293b;
    border: 1px solid #475569;
    text-align: center;
    animation: pop .35s ease;
}

.feedback.show {
    display: block;
}

.feedback-icon {
    font-size: 45px;
}

.feedback-title {
    font-size: 22px;
    font-weight: bold;
    margin: 6px 0;
}

.feedback-text {
    font-size: 17px;
    color: #cbd5e1;
    line-height: 1.4;
}

.next-btn {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 14px;
    background: #22c55e;
    color: #fff;
    font-size: 19px;
    font-weight: bold;
}

/* =========================
   SECONDARY
========================= */

.secondary-card {
    display: none;
    margin: 12px;
    padding: 17px;
    border-radius: 20px;
    background: #3b1d46;
    border: 2px solid #a855f7;
}

.secondary-card.show {
    display: block;
    animation: pop .4s ease;
}

.secondary-title {
    font-size: 21px;
    font-weight: bold;
    color: #f0abfc;
}

.secondary-desc {
    margin: 7px 0 12px;
    color: #e9d5ff;
    font-size: 17px;
}

.secondary-timer {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================
   END
========================= */

#endScreen {
    display: none;
    min-height: 100vh;
    padding: 35px 20px;
    text-align: center;
}

.end-icon {
    font-size: 80px;
}

.end-title {
    font-size: 32px;
    color: #f87171;
    margin: 10px 0;
}

.final-score {
    font-size: 48px;
    font-weight: bold;
    color: #facc15;
    margin: 20px 0;
}

.end-info {
    background: rgba(255,255,255,.08);
    border-radius: 20px;
    padding: 20px;
    font-size: 18px;
}

.reset-note {
    margin-top: 20px;
    color: #94a3b8;
    line-height: 1.4;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes ambulanceFloat {
    0%,100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-8px);
    }
}

@keyframes pulse {
    50% {
        transform: scale(1.05);
    }
}

@keyframes shake {
    0%,100% {
        transform: translateX(-50%);
    }
    25% {
        transform: translateX(-54%);
    }
    75% {
        transform: translateX(-46%);
    }
}

@keyframes rainMove {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 30px 60px;
    }
}

@keyframes firePulse {
    from {
        opacity: .5;
    }
    to {
        opacity: 1;
    }
}

@keyframes waterMove {
    from {
        transform: translateY(5px);
    }
    to {
        transform: translateY(-5px);
    }
}

@keyframes trafficBlink {
    from {
        opacity: .3;
    }
    to {
        opacity: 1;
    }
}

@keyframes warningBlink {
    50% {
        opacity: .2;
    }
}

@keyframes smokeMove {
    from {
        transform: translateX(-8px);
    }
    to {
        transform: translateX(8px);
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes pop {
    from {
        opacity: 0;
        transform: scale(.94);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* =========================
   SMALL SCREEN
========================= */

@media (max-width: 380px) {

    .question-text {
        font-size: 19px;
    }

    .answer-btn {
        font-size: 16px;
    }

    .item-btn {
        font-size: 13px;
    }

    .item-btn .item-icon {
        font-size: 26px;
    }

    .map {
        height: 225px;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     START
========================= -->

<section id="startScreen">

    <div class="logo">
        <div class="emoji">🚑</div>

        <h1>Cuộc Đua Cứu Hộ</h1>

        <p>
            Trả lời đúng – chọn đúng – đưa bệnh nhân đến bệnh viện!
        </p>
    </div>

    <div class="start-card">

        <label for="teamInput">
            👥 Tên đội
        </label>

        <input
            id="teamInput"
            class="team-input"
            type="text"
            maxlength="25"
            placeholder="Nhập tên đội..."
        >

        <button
            type="button"
            class="start-btn"
            id="startBtn">
            🚑 BẮT ĐẦU
        </button>

        <div class="start-sound">
            <button
                type="button"
                class="sound-btn"
                id="startSoundBtn">
                🔊
            </button>
        </div>

    </div>

</section>


<!-- =========================
     GAME
========================= -->

<section id="gameScreen">

    <header class="topbar">

        <div>
            <div class="team-name" id="teamNameDisplay">
                Đội
            </div>

            <div class="stage-text" id="stageDisplay">
                Câu 1/10
            </div>
        </div>

        <div class="stats">

            <span
                class="hearts"
                id="heartsDisplay">
                ❤️❤️❤️
            </span>

            <span
                class="score"
                id="scoreDisplay">
                ⭐ 0
            </span>

        </div>

        <button
            type="button"
            class="sound-btn game-sound"
            id="gameSoundBtn">
            🔊
        </button>

    </header>


    <!-- TIMER -->

    <div class="timer-box">

        <div
            class="timer"
            id="mainTimer">
            20
        </div>

    </div>


    <!-- MAP -->

    <div class="map-wrap">

        <div
            class="map"
            id="map">

            <img
                src="images/main-scene.png"
                class="main-scene"
                id="mainScene"
                alt="Cảnh cứu hộ">

            <div
                class="effect-overlay"
                id="effectOverlay">
            </div>

            <div
                class="ambulance"
                id="ambulance">
                🚑
            </div>

        </div>

    </div>


    <!-- MAIN QUESTION -->

    <div
        class="question-card"
        id="mainQuestionCard">

        <div class="question-label">
            🚨 CÂU HỎI CHÍNH
        </div>

        <div
            class="question-text"
            id="mainQuestion">
        </div>

        <div
            class="answers"
            id="mainAnswers">
        </div>

    </div>


    <!-- ITEM CHOICE -->

    <div
        class="choice-card"
        id="itemCard">

        <div class="choice-title">
            🧰 Chọn một dụng cụ cứu hộ
        </div>

        <div
            class="items"
            id="items">
        </div>

    </div>


    <!-- ROUTE CHOICE -->

    <div
        class="choice-card"
        id="routeCard">

        <div class="choice-title">
            🛣️ Chọn hướng đi
        </div>

        <div class="routes">

            <button
                type="button"
                class="route-btn route-left"
                data-route="left">
                ← RẼ TRÁI
            </button>

            <button
                type="button"
                class="route-btn route-straight"
                data-route="straight">
                ↑ ĐI THẲNG
            </button>

            <button
                type="button"
                class="route-btn route-right"
                data-route="right">
                RẼ PHẢI →
            </button>

        </div>

    </div>


    <!-- SITUATION -->

    <div
        class="situation"
        id="situation">

        <div
            class="situation-title"
            id="situationTitle">
        </div>

        <div
            class="situation-text"
            id="situationText">
        </div>

    </div>


    <!-- FEEDBACK -->

    <div
        class="feedback"
        id="feedback">

        <div
            class="feedback-icon"
            id="feedbackIcon">
            🚑
        </div>

        <div
            class="feedback-title"
            id="feedbackTitle">
        </div>

        <div
            class="feedback-text"
            id="feedbackText">
        </div>

        <button
            type="button"
            class="next-btn"
            id="nextBtn">
            TIẾP TỤC →
        </button>

    </div>


    <!-- SECONDARY QUESTION -->

    <div
        class="secondary-card"
        id="secondaryCard">

        <div class="secondary-title">
            😂 Tình huống bất ngờ!
        </div>

        <div
            class="secondary-desc"
            id="secondaryDesc">
        </div>

        <div
            class="secondary-timer"
            id="secondaryTimer">
            10
        </div>

        <div
            class="answers"
            id="secondaryAnswers">
        </div>

    </div>

</section>


<!-- =========================
     END
========================= -->

<section id="endScreen">

    <div class="end-icon">
        🏥
    </div>

    <div
        class="end-title"
        id="endTitle">
        Hoàn thành!
    </div>

    <div>
        Đội:
        <strong id="endTeam">
        </strong>
    </div>

    <div class="final-score">
        <span id="finalScore">
            0
        </span>
        điểm
    </div>

    <div
        class="end-info"
        id="endInfo">
    </div>

    <div class="reset-note">
        Giáo viên có thể bắt đầu lượt chơi mới để thử lại.
    </div>

</section>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
    id="bgMusic"
    loop
    preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>


<script>

/* =====================================================
   GAME DATA
===================================================== */

const mainQuestions = [

    {
        q: "Một giờ có bao nhiêu phút?",
        answers: ["30 phút", "60 phút", "90 phút", "120 phút"],
        correct: 1
    },

    {
        q: "5 × 6 bằng bao nhiêu?",
        answers: ["25", "30", "35", "40"],
        correct: 1
    },

    {
        q: "Thủ đô của Việt Nam là gì?",
        answers: ["Huế", "Đà Nẵng", "Hà Nội", "TP. Hồ Chí Minh"],
        correct: 2
    },

    {
        q: "Nước sôi ở nhiệt độ khoảng bao nhiêu?",
        answers: ["50°C", "75°C", "100°C", "150°C"],
        correct: 2
    },

    {
        q: "Hình tam giác có bao nhiêu cạnh?",
        answers: ["2", "3", "4", "5"],
        correct: 1
    },

    {
        q: "Mặt trời mọc ở hướng nào?",
        answers: ["Tây", "Nam", "Bắc", "Đông"],
        correct: 3
    },

    {
        q: "Một tuần có bao nhiêu ngày?",
        answers: ["5", "6", "7", "8"],
        correct: 2
    },

    {
        q: "10 + 15 bằng bao nhiêu?",
        answers: ["20", "25", "30", "35"],
        correct: 1
    },

    {
        q: "Theo cách chia phổ biến ở miền Bắc, một năm có mấy mùa?",
        answers: ["2 mùa", "3 mùa", "4 mùa", "5 mùa"],
        correct: 2
    },

    {
        q: "Hành tinh chúng ta đang sống là gì?",
        answers: ["Sao Hỏa", "Trái Đất", "Sao Kim", "Sao Mộc"],
        correct: 1
    }

];

document
    .getElementById("startBtn")
    .addEventListener("click", startGame);

function startGame() {

    const name =
        teamInput.value.trim();

    if (!name) {
        alert("Vui lòng nhập tên đội!");
        teamInput.focus();
        return;
    }

    team.name = name;
    team.score = 0;
    team.hearts = 3;

    currentStage = 0;

    startScreen.style.display = "none";
    endScreen.style.display = "none";
    gameScreen.style.display = "block";

    updateStats();

    startMusic();

    loadStage();
}

        bgMusic.pause();

    }

    updateSoundButtons();
}


function updateSoundButtons() {

    const icon =
        musicOn ? "🔊" : "🔇";

    document.getElementById(
        "startSoundBtn"
    ).textContent = icon;

    document.getElementById(
        "gameSoundBtn"
    ).textContent = icon;
}


document
    .getElementById("startSoundBtn")
    .addEventListener("click", function(e) {

        e.stopPropagation();
        toggleMusic();

    });


document
    .getElementById("gameSoundBtn")
    .addEventListener("click", function(e) {

        e.stopPropagation();
        toggleMusic();

    });


/* =====================================================
   LOAD STAGE
===================================================== */

function loadStage() {

    clearTimers();

    selectedItem = null;
    selectedRoute = null;

    resetVisualState();

    itemCard.classList.remove("show");
    routeCard.classList.remove("show");
    situation.classList.remove("show");
    feedback.classList.remove("show");
    secondaryCard.classList.remove("show");

    document.getElementById(
        "mainQuestionCard"
    ).style.display = "block";

    const data =
        mainQuestions[currentStage];

    stageDisplay.textContent =
        `Câu ${currentStage + 1}/10`;

    mainQuestion.textContent =
        data.q;

    createMainAnswers(data);

    startMainTimer();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =====================================================
   MAIN ANSWERS
===================================================== */

function createMainAnswers(data) {

    mainAnswers.innerHTML = "";

    data.answers.forEach(
        (answer, index) => {

            const btn =
                document.createElement("button");

            btn.type = "button";
            btn.className = "answer-btn";
            btn.textContent = answer;

            btn.addEventListener(
                "click",
                () => answerMain(index, btn)
            );

            mainAnswers.appendChild(btn);

        }
    );
}


function answerMain(index, button) {

    if (mainAnswers.dataset.locked === "true") {
        return;
    }

    mainAnswers.dataset.locked = "true";

    clearInterval(mainTimerInterval);

    const data =
        mainQuestions[currentStage];

    if (index === data.correct) {

        button.classList.add("correct");

        team.score += 10;

        updateStats();

        setTimeout(() => {

            showItemChoice();

        }, 500);

    } else {

        button.classList.add("wrong");

        loseHeart();

    }
}


/* =====================================================
   MAIN TIMER
===================================================== */

function startMainTimer() {

    mainTimerValue = 20;

    mainTimer.textContent =
        mainTimerValue;

    mainTimer.className = "timer";

    mainAnswers.dataset.locked = "false";

    mainTimerInterval =
        setInterval(() => {

            mainTimerValue--;

            mainTimer.textContent =
                mainTimerValue;

            if (mainTimerValue <= 7) {
                mainTimer.classList.add("danger");
            } else if (mainTimerValue <= 12) {
                mainTimer.classList.add("warning");
            }

            if (mainTimerValue <= 0) {

                clearInterval(mainTimerInterval);

                mainAnswers.dataset.locked =
                    "true";

                loseHeart();

            }

        }, 1000);
}


/* =====================================================
   LOSE HEART
===================================================== */

function loseHeart() {

    clearTimers();

    team.hearts--;

    updateStats();

    feedback.classList.add("show");

    feedbackIcon.textContent = "💔";

    feedbackTitle.textContent =
        "Rất tiếc! Mất 1 tim";

    feedbackText.textContent =
        "Bạn đã dùng hết một cơ hội ở câu hỏi chính.";

    document.getElementById(
        "mainQuestionCard"
    ).style.display = "none";

    itemCard.classList.remove("show");
    routeCard.classList.remove("show");

    if (team.hearts <= 0) {

        nextBtn.textContent =
            "XEM KẾT QUẢ";

        nextBtn.onclick =
            endGame;

    } else {

        nextBtn.textContent =
            "SANG CÂU TIẾP →";

        nextBtn.onclick =
            nextStage;

    }
}


/* =====================================================
   ITEM CHOICE
===================================================== */

function showItemChoice() {

    document.getElementById(
        "mainQuestionCard"
    ).style.display = "none";

    itemCard.classList.add("show");

    routeCard.classList.remove("show");

    situation.classList.remove("show");
    feedback.classList.remove("show");

    createItems();

    window.scrollTo({
        top: 250,
        behavior: "smooth"
    });
}


function createItems() {

    items.innerHTML = "";

    const stage =
        stages[currentStage];

    const needs = [
        stage.left.need,
        stage.straight.need,
        stage.right.need
    ];

    let available = [];

    needs.forEach(id => {

        if (!available.includes(id)) {
            available.push(id);
        }

    });

    allItems.forEach(item => {

        if (
            available.length < 3 &&
            !available.includes(item.id)
        ) {
            available.push(item.id);
        }

    });

    available =
        available.slice(0, 3);

    available.forEach(id => {

        const item =
            allItems.find(
                x => x.id === id
            );

        const btn =
            document.createElement("button");

        btn.type = "button";
        btn.className = "item-btn";

        btn.innerHTML = `
            <span class="item-icon">
                ${item.icon}
            </span>
            ${item.name}
        `;

        btn.addEventListener(
            "click",
            () => selectItem(item.id, btn)
        );

        items.appendChild(btn);

    });
}


function selectItem(itemId, button) {

    selectedItem = itemId;

    document
        .querySelectorAll(".item-btn")
        .forEach(btn => {
            btn.classList.remove("selected");
        });

    button.classList.add("selected");

    routeCard.classList.add("show");

    window.scrollTo({
        top: 400,
        behavior: "smooth"
    });
}


/* =====================================================
   ROUTE
===================================================== */

document
    .querySelectorAll(".route-btn")
    .forEach(btn => {

        btn.addEventListener(
            "click",
            () => {

                const route =
                    btn.dataset.route;

                chooseRoute(route);

            }
        );

    });


function chooseRoute(route) {

    if (!selectedItem) {

        alert("Hãy chọn một dụng cụ trước!");
        return;

    }

    selectedRoute = route;

    const data =
        stages[currentStage][route];

    clearTimers();

    routeCard.classList.remove("show");

    showSituation(data);

    moveAmbulance();

    setTimeout(() => {

        if (selectedItem === data.need) {

            correctItem(data);

        } else {

            wrongItem(data);

        }

    }, 900);
}


/* =====================================================
   SITUATION + EFFECT
===================================================== */

function showSituation(data) {

    situation.classList.add("show");

    situationTitle.textContent =
        data.title;

    situationText.textContent =
        data.text;

    activateEffect(data.effect);

    window.scrollTo({
        top: 280,
        behavior: "smooth"
    });
}


function activateEffect(effect) {

    resetVisualState();

    effectOverlay.className =
        "effect-overlay active";

    mainScene.style.filter =
        "none";

    /*
       30 hiệu ứng riêng
    */

    switch(effect) {

        /* Q1 */

        case "tree":
            effectOverlay.classList.add(
                "effect-warning"
            );
            ambulance.classList.add("shake");
            break;

        case "traffic":
            effectOverlay.classList.add(
                "effect-traffic"
            );
            break;

        case "flood":
            effectOverlay.classList.add(
                "effect-flood"
            );
            break;


        /* Q2 */

        case "dog":
            ambulance.classList.add("shake");
            break;

        case "bridge":
            effectOverlay.classList.add(
                "effect-warning"
            );
            ambulance.classList.add("shake");
            break;

        case "dark":
            effectOverlay.classList.add(
                "effect-dark"
            );
            mainScene.style.filter =
                "brightness(.28)";
            break;


        /* Q3 */

        case "rock":
            effectOverlay.classList.add(
                "effect-warning"
            );
            ambulance.classList.add("shake");
            break;

        case "brokencar":
            effectOverlay.classList.add(
                "effect-traffic"
            );
            break;

        case "confusing":
            mainScene.style.filter =
                "saturate(.75) contrast(1.1)";
            break;


        /* Q4 */

        case "fire":
            effectOverlay.classList.add(
                "effect-fire"
            );
            break;

        case "branch":
            ambulance.classList.add("shake");
            break;

        case "construction":
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;


        /* Q5 */

        case "fog":
            effectOverlay.classList.add(
                "effect-fog"
            );
            mainScene.style.filter =
                "brightness(.8)";
            break;

        case "tire":
            ambulance.classList.add("shake");
            break;

        case "rope":
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;


        /* Q6 */

        case "blackout":
            effectOverlay.classList.add(
                "effect-dark"
            );
            mainScene.style.filter =
                "brightness(.2)";
            break;

        case "fallingbranch":
            ambulance.classList.add("shake");
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;

        case "patient":
            mainScene.style.filter =
                "brightness(1.05) saturate(1.2)";
            break;


        /* Q7 */

        case "debris":
            ambulance.classList.add("shake");
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;

        case "police":
            effectOverlay.classList.add(
                "effect-traffic"
            );
            break;

        case "heavyRain":
            effectOverlay.classList.add(
                "effect-rain"
            );
            break;


        /* Q8 */

        case "animals":
            ambulance.classList.add("shake");
            break;

        case "smoke":
            effectOverlay.classList.add(
                "effect-smoke"
            );
            break;

        case "landslide":
            effectOverlay.classList.add(
                "effect-warning"
            );
            ambulance.classList.add("shake");
            break;


        /* Q9 */

        case "truck":
            effectOverlay.classList.add(
                "effect-traffic"
            );
            break;

        case "narrowBridge":
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;

        case "waterCross":
            effectOverlay.classList.add(
                "effect-flood"
            );
            break;


        /* Q10 */

        case "hospitalRoad":
            mainScene.style.filter =
                "brightness(1.1) saturate(1.15)";
            break;

        case "blockedHospital":
            effectOverlay.classList.add(
                "effect-warning"
            );
            break;

        case "hospitalPatient":
            mainScene.style.filter =
                "brightness(1.1) saturate(1.2)";
            break;

    }
}


function resetVisualState() {

    effectOverlay.className =
        "effect-overlay";

    ambulance.className =
        "ambulance";

    mainScene.style.filter =
        "none";

}


/* =====================================================
   AMBULANCE MOVEMENT
===================================================== */

function moveAmbulance() {

    ambulance.classList.remove(
        "move-forward"
    );

    void ambulance.offsetWidth;

    ambulance.classList.add(
        "move-forward"
    );

}


/* =====================================================
   CORRECT ITEM
===================================================== */

function correctItem(data) {

    team.score += 3;

    updateStats();

    feedback.classList.add("show");

    feedbackIcon.textContent = "🎉";

    feedbackTitle.textContent =
        "Chọn đúng dụng cụ! +3 điểm";

    feedbackText.textContent =
        data.funnyGood;

    nextBtn.textContent =
        currentStage === 9
        ? "HOÀN THÀNH 🏥"
        : "TIẾP TỤC →";

    nextBtn.onclick =
        nextStage;

}


/* =====================================================
   WRONG ITEM
===================================================== */

function wrongItem(data) {

    feedback.classList.add("show");

    feedbackIcon.textContent =
        "😂";

    feedbackTitle.textContent =
        "Ôi! Chọn nhầm dụng cụ rồi!";

    feedbackText.textContent =
        data.funnyBad;

    nextBtn.textContent =
        "TRẢ LỜI CÂU HỎI PHỤ →";

    nextBtn.onclick =
        () => startSecondary(data);

}


/* =====================================================
   SECONDARY QUESTION
===================================================== */

function startSecondary(data) {

    feedback.classList.remove("show");

    secondaryCard.classList.add("show");

    const question =
        secondaryQuestions[
            currentStage %
            secondaryQuestions.length
        ];

    secondaryDesc.textContent =
        data.secondary + " " + question.q;

    createSecondaryAnswers(question);

    startSecondaryTimer();

    window.scrollTo({
        top: 400,
        behavior: "smooth"
    });
}


function createSecondaryAnswers(question) {

    secondaryAnswers.innerHTML = "";

    question.answers.forEach(
        (answer, index) => {

            const btn =
                document.createElement("button");

            btn.type = "button";
            btn.className = "answer-btn";
            btn.textContent = answer;

            btn.addEventListener(
                "click",
                () => answerSecondary(
                    index,
                    question.correct,
                    btn
                )
            );

            secondaryAnswers.appendChild(btn);

        }
    );

    secondaryAnswers.dataset.locked =
        "false";
}


/* =====================================================
   SECONDARY TIMER
===================================================== */

function startSecondaryTimer() {

    secondaryTimerValue = 10;

    secondaryTimer.textContent =
        secondaryTimerValue;

    secondaryTimerInterval =
        setInterval(() => {

            secondaryTimerValue--;

            secondaryTimer.textContent =
                secondaryTimerValue;

            if (secondaryTimerValue <= 0) {

                clearInterval(
                    secondaryTimerInterval
                );

                secondaryAnswers.dataset.locked =
                    "true";

                secondaryResult(false, true);

            }

        }, 1000);
}


/* =====================================================
   SECONDARY ANSWER
===================================================== */

function answerSecondary(
    index,
    correctIndex,
    button
) {

    if (
        secondaryAnswers.dataset.locked ===
        "true"
    ) {
        return;
    }

    secondaryAnswers.dataset.locked =
        "true";

    clearInterval(
        secondaryTimerInterval
    );

    if (index === correctIndex) {

        button.classList.add("correct");

        secondaryResult(true, false);

    } else {

        button.classList.add("wrong");

        secondaryResult(false, false);

    }
}


function secondaryResult(
    correct,
    timeout
) {

    if (correct) {

        team.score += 2;

        feedbackIcon.textContent =
            "🎯";

        feedbackTitle.textContent =
            "Chính xác! +2 điểm";

        feedbackText.textContent =
            "Bạn xử lý được tình huống bất ngờ.";

    } else {

        team.score -= 2;

        feedbackIcon.textContent =
            timeout ? "⏰" : "😅";

        feedbackTitle.textContent =
            timeout
            ? "Hết giờ! -2 điểm"
            : "Chưa chính xác! -2 điểm";

        feedbackText.textContent =
            "Không sao! Bạn không bị mất tim.";

    }

    updateStats();

    secondaryCard.classList.remove("show");

    feedback.classList.add("show");

    nextBtn.textContent =
        currentStage === 9
        ? "HOÀN THÀNH 🏥"
        : "TIẾP TỤC →";

    nextBtn.onclick =
        nextStage;
}


/* =====================================================
   NEXT STAGE
===================================================== */

function nextStage() {

    clearTimers();

    if (currentStage >= 9) {

        endGame();
        return;

    }

    currentStage++;

    if (team.hearts <= 0) {

        endGame();
        return;

    }

    loadStage();
}


/* =====================================================
   END GAME
===================================================== */

function endGame() {

    clearTimers();

    gameScreen.style.display =
        "none";

    endScreen.style.display =
        "block";

    document.getElementById(
        "endTeam"
    ).textContent =
        team.name;

    document.getElementById(
        "finalScore"
    ).textContent =
        team.score;

    if (team.hearts <= 0) {

        document.getElementById(
            "endTitle"
        ).textContent =
            "🚑 Hết tim!";

        document.getElementById(
            "endInfo"
        ).innerHTML = `
            Đội đã hết ❤️ nhưng vẫn giữ nguyên
            <strong>${team.score} điểm</strong>
            đã đạt được.
            <br><br>
            🏆 Điểm cao nhất sẽ quyết định đội chiến thắng.
        `;

    } else {

        document.getElementById(
            "endTitle"
        ).textContent =
            "🏥 Hoàn thành nhiệm vụ!";

        document.getElementById(
            "endInfo"
        ).innerHTML = `
            ❤️ Tim còn lại:
            <strong>${team.hearts}/3</strong>
            <br><br>
            🚑 Bệnh nhân đã được đưa đến bệnh viện!
            <br><br>
            🏆 Hãy so sánh điểm với các đội khác.
        `;

    }

}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

    teamNameDisplay.textContent =
        team.name;

    scoreDisplay.textContent =
        `⭐ ${team.score}`;

    heartsDisplay.textContent =
        "❤️".repeat(
            Math.max(0, team.hearts)
        ) +
        "🖤".repeat(
            Math.max(0, 3 - team.hearts)
        );

    stageDisplay.textContent =
        `Câu ${Math.min(
            currentStage + 1,
            10
        )}/10`;

}


/* =====================================================
   CLEAR TIMERS
===================================================== */

function clearTimers() {

    if (mainTimerInterval) {

        clearInterval(
            mainTimerInterval
        );

        mainTimerInterval = null;

    }

    if (secondaryTimerInterval) {

        clearInterval(
            secondaryTimerInterval
        );

        secondaryTimerInterval = null;

    }

}


/* =====================================================
   INITIAL
===================================================== */

updateSoundButtons();

</script>
