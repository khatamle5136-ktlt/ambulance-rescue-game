```html
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra Firebase</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f6fb;
      color: #222;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 16px #0001;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #eee;
    }

    .note {
      font-size: 14px;
      color: #555;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🚑 Kiểm tra kết nối Firebase</h2>

    <p>Nhấn nút bên dưới để kiểm tra đăng nhập ẩn danh.</p>

    <button id="testBtn">Kiểm tra đăng nhập</button>

    <div id="result">Chưa kiểm tra.</div>

    <p class="note">
      Đây là trang kiểm tra riêng, không làm thay đổi giao diện game.
    </p>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInAnonymously
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore
    } from
      "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDS3ZSPvyIM34BF2aChbHYJ-izt-65rVUg",
      authDomain: "ambulance-rescue-game-1611.firebaseapp.com",
      projectId: "ambulance-rescue-game-1611",
      storageBucket: "ambulance-rescue-game-1611.firebasestorage.app",
      messagingSenderId: "645151324428",
      appId: "1:645151324428:web:6fb3641655e504a1d57129",
      measurementId: "G-T3TGVJF7EK"
    };

    const result = document.getElementById("result");
    const button = document.getElementById("testBtn");

    button.addEventListener("click", async () => {
      button.disabled = true;
      result.textContent = "⏳ Đang kiểm tra đăng nhập Firebase...";

      try {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Khởi tạo Firestore để kiểm tra cấu hình ứng dụng.
        getFirestore(app);

        const credential = await signInAnonymously(auth);

        result.textContent =
          "✅ ĐĂNG NHẬP FIREBASE THÀNH CÔNG!\n\n" +
          "Project ID: " + app.options.projectId + "\n" +
          "Đăng nhập ẩn danh: Thành công\n" +
          "User ID: " + credential.user.uid + "\n\n" +
          "Bước tiếp theo: tích hợp Firebase vào game.";

      } catch (error) {
        console.error("Firebase test error:", error);

        result.textContent =
          "❌ CHƯA KẾT NỐI THÀNH CÔNG\n\n" +
          "Mã lỗi: " + (error.code || "Không có mã lỗi") + "\n" +
          "Chi tiết: " + (error.message || "Không có thông tin") +
          "\n\nHãy gửi nguyên văn thông báo này cho ChatGPT.";

      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
